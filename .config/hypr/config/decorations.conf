# ┃                    Decorations Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/colors.conf

# https://wiki.hyprland.org/Configuring/Variables/#decoration

decoration {
    rounding = 16
    active_opacity = 1.0
    inactive_opacity = 0.9

    # Меньше блюра + насыщеннее, чтобы обои просвечивали красным
    blur {
        enabled = true
        size = 24
        passes = 1
        vibrancy = 0.6
        vibrancy_darkness = 0.35
        contrast = 1.0
        brightness = 0.95
        new_optimizations = true
        xray = false
    }

    # Блок теней
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(0a0000cc)
    }
}
