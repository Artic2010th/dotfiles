# Правила для Thunar
windowrule = match:class ^(thunar)$, float on
windowrule = match:class ^(thunar)$, size 800 500
windowrule = match:class ^(thunar)$, center on

# Discord
windowrule = match:class ^(discord)$, workspace 3

# Медиа (mpv, imv)
windowrule = match:title ^(mpv|imv)$, float on
windowrule = match:title ^(mpv|imv)$, center on
windowrule = match:title ^(mpv|imv)$, size 1200 720

# Firefox
# Найди строку 15 (там где firefox или блюр) и замени на:
windowrule = match:class ^(firefox)$, no_blur on
# Модальные окна
windowrule = match:modal 1, float on
windowrule = match:modal 1, center on

# Обобщенное правило (строка 26 в твоем логе)
windowrule = match:class .*, float off
