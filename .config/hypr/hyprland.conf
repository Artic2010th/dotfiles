# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                 CachyOS Hyprland Configuration              ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

$mainMod = SUPER
$terminal = alacritty
$menu = rofi -show drun

# ПОДКЛЮЧЕНИЕ ФАЙЛОВ
source = ~/.config/hypr/config/animations.conf
source = ~/.config/hypr/config/autostart.conf
source = ~/.config/hypr/config/decorations.conf
source = ~/.config/hypr/config/environment.conf
source = ~/.config/hypr/config/monitor.conf
source = ~/.config/hypr/config/variables.conf
source = ~/.config/hypr/config/input.conf
source = ~/.config/hypr/config/windowrules.conf
source = ~/.config/hypr/config/keybinds.conf

# НАСТРОЙКИ ВВОДА
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    resolve_binds_by_sym = 0
}

# БИНДЫ
bind = $mainMod, E, exec, nautilus --new-window
bind = $mainMod, D, exec, $menu
bind = $mainMod, H, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, D, exec, grim -g "$(slurp)" - | swappy -f -

# АВТОЗАГРУЗКА
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor ArcDusk-cursors 20
exec-once = /usr/bin/kwalletd6

# ПРАВИЛА СЛОЕВ (LAYER RULES)
layerrule = blur on, match:namespace ^(waybar)$
layerrule = ignore_alpha 0.5, match:namespace ^(waybar)$

layerrule = blur on, match:namespace ^(nwg-dock|nwg-dock-hyprland)$
layerrule = ignore_alpha 0.5, match:namespace ^(nwg-dock|nwg-dock-hyprland)$

# ТЁМНАЯ ТЕМА ДЛЯ ПРИЛОЖЕНИЙ
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,kvantum
env = GTK_THEME,Adwaita-dark
